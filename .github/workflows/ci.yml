name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Least-privilege default for GITHUB_TOKEN; a job that needs more widens it locally.
permissions:
  contents: read

jobs:
  build:
    name: Typecheck & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Audit prod dependencies (high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Single required check for branch protection.
  ci-gate:
    needs: [build, secret-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require upstream jobs to have passed
        run: |
          for r in "${{ needs.build.result }}" "${{ needs.secret-scan.result }}"; do
            [ "$r" = "success" ] || { echo "::error::a required job did not pass ($r)"; exit 1; }
          done

  deploy:
    name: Deploy
    needs: [ci-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, homelab]
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    timeout-minutes: 10
    env:
      COMPOSE: docker compose -f compose.prod.yaml
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Build new image
        run: $COMPOSE build

      - name: Roll onto the new image
        run: $COMPOSE up -d --remove-orphans

      - name: Healthcheck
        run: |
          # Socket Mode has no HTTP endpoint. Confirm the container is running
          # (not crash-looping) and its startup line appears in this deploy's logs.
          ok=false
          for i in $(seq 1 20); do
            state=$(docker inspect -f '{{.State.Status}}' bumblebee 2>/dev/null || echo missing)
            if [ "$state" = "running" ] && \
               docker logs --since 120s bumblebee 2>&1 | grep -q "running (socket mode)"; then
              ok=true; break
            fi
            sleep 3
          done
          if [ "$ok" != true ]; then
            echo "::error::Bumblebee did not report healthy startup"
            docker logs --since 120s bumblebee 2>&1 | tail -30 || true
            exit 1
          fi
          echo "Healthcheck passed"

      - name: Prune dangling images
        if: always()
        continue-on-error: true
        run: docker image prune -f

      - name: Deploy summary
        if: always()
        run: |
          {
            echo "## Deploy"
            echo "| | |"
            echo "| --- | --- |"
            echo "| SHA | \`${{ github.sha }}\` |"
            echo "| Status | ${{ job.status == 'success' && '✅ Deployed' || '❌ Failed' }} |"
          } >> "$GITHUB_STEP_SUMMARY"
